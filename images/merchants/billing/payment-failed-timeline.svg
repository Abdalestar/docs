<svg viewBox="0 0 920 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="What happens after a Qtap payment fails: day zero the plan shows Past Due and features drop to Starter, days one to thirteen nothing is removed and you can fix the card, day fourteen the plan becomes Starter and the oldest branches, staff and loyalty cards are switched off.">
  <rect x="0" y="0" width="920" height="400" fill="#F8F5F2"/>

  <text x="40" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="600" fill="#423F4C">After a payment fails</text>
  <text x="40" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#6B6770">Two things happen on different clocks. Updating the card at any point stops the rest.</text>

  <line x1="40" y1="118" x2="880" y2="118" stroke="#6B6770" stroke-width="2" opacity="0.35"/>
  <circle cx="145" cy="118" r="8" fill="#8E4A63"/>
  <circle cx="460" cy="118" r="8" fill="#6B6770"/>
  <circle cx="775" cy="118" r="8" fill="#423F4C"/>

  <!-- Day 0 -->
  <text x="145" y="103" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#8E4A63">Day 0</text>
  <rect x="40" y="142" width="210" height="182" rx="10" fill="#FFFFFF" stroke="#8E4A63" stroke-width="2"/>
  <text x="58" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#423F4C">The charge fails</text>
  <text x="58" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6B6770">Billing shows Past Due</text>
  <text x="58" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6B6770">and a red banner.</text>
  <text x="58" y="246" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6B6770">Your plan features drop</text>
  <text x="58" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6B6770">to Starter right away.</text>
  <text x="58" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#8E4A63">Nothing is removed.</text>

  <!-- Days 1-13 -->
  <text x="460" y="103" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#6B6770">Days 1 to 13</text>
  <rect x="355" y="142" width="210" height="182" rx="10" fill="#FFFFFF" stroke="#6B6770" stroke-width="2"/>
  <text x="373" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#423F4C">The window</text>
  <text x="373" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6B6770">Stripe retries the card.</text>
  <text x="373" y="224" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6B6770">Your branches, staff and</text>
  <text x="373" y="246" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6B6770">cards stay exactly as</text>
  <text x="373" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6B6770">they are.</text>
  <text x="373" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#8E4A63">Fix the card, it ends.</text>

  <!-- Day 14 -->
  <text x="775" y="103" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#423F4C">Day 14</text>
  <rect x="670" y="142" width="210" height="182" rx="10" fill="#423F4C"/>
  <text x="688" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#F8F5F2">The cut</text>
  <text x="688" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#F0D793">Your plan becomes</text>
  <text x="688" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#F0D793">Starter for real.</text>
  <text x="688" y="246" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#F8F5F2">Qtap switches off your</text>
  <text x="688" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#F8F5F2">oldest branches, staff</text>
  <text x="688" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#F8F5F2">and loyalty cards.</text>
  <text x="688" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#F0D793">Members keep everything.</text>

  <text x="40" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6B6770">Your members, their stamps, points and history are never touched at any stage.</text>
  <text x="40" y="382" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6B6770">Anything switched off on day 14 stays off until you turn it back on by hand.</text>
</svg>
